<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChainReady — Property Transaction Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Poiret+One&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    :root {
      --bg: #0c1814;
      --bg-grad-1: #0e1c17;
      --surface: #142822;
      --surface-2: #1a322b;
      --line: rgba(232,226,208,0.10);
      --line-2: rgba(232,226,208,0.16);
      --gold: #c8a24a;
      --gold-light: #ddc080;
      --gold-deep: #9c7b2f;
      --cream: #e8e2d0;
      --ink: #ece7d6;
      --muted: rgba(236,231,214,0.56);
      --faint: rgba(236,231,214,0.34);
      --sage: #7fae9e;
      --sage-deep: #527e70;
      --clay: #c98a5e;
      --pos: #84c9a5;
      --neg: #e29c81;
      --radius: 3px;
    }
    body {
      background:
        radial-gradient(1200px 700px at 50% -10%, var(--bg-grad-1) 0%, var(--bg) 55%);
      color: var(--ink);
      font-family: 'Jost', system-ui, sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    em { font-style: normal; color: var(--gold); }
    input:focus, button:focus { outline: none; }
    input[type=number] { -moz-appearance: textfield; }
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

    /* ─── DISPLAY TYPE — direction-driven ─── */
    #cr-root[data-direction="savoy"]    { --font-display: 'Poiret One', 'Jost', sans-serif; --disp-spacing: 0.5px; --disp-weight: 400; --disp-transform: none; }
    #cr-root[data-direction="monogram"] { --font-display: 'Jost', sans-serif; --disp-spacing: 3px; --disp-weight: 600; --disp-transform: uppercase; }

    .cr-app { max-width: 1040px; margin: 0 auto; padding-bottom: 64px; }

    /* ─── HEADER ─── */
    .cr-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 28px 18px; border-bottom: 1px solid var(--line);
      position: relative;
    }
    .cr-header::after {
      content: ""; position: absolute; left: 28px; right: 28px; bottom: -4px;
      height: 1px; background: linear-gradient(90deg, transparent, var(--gold-deep) 20%, var(--gold-deep) 80%, transparent);
      opacity: 0.4;
    }
    #cr-root[data-ornaments="off"] .cr-header::after { display: none; }
    .cr-brand-wrap { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
    .cr-brand {
      font-family: var(--font-display); font-weight: var(--disp-weight);
      font-size: 22px; letter-spacing: 4px; text-transform: uppercase; color: var(--cream);
    }
    .cr-badge {
      font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold);
      border: 1px solid var(--gold-deep); padding: 4px 11px; border-radius: 40px;
      background: none; cursor: pointer; font-family: 'Jost', sans-serif;
    }
    .cr-badge:hover { background: rgba(200,162,74,0.1); }
    .cr-header-right { display: flex; align-items: center; gap: 14px; }
    .cr-export { display: flex; align-items: center; gap: 6px; }

    /* ─── BUTTONS / LINKS ─── */
    .cr-link {
      background: none; border: none; color: var(--muted); font-size: 12px; cursor: pointer;
      font-family: 'Jost', sans-serif; letter-spacing: 0.3px; transition: color 0.18s; white-space: nowrap;
    }
    .cr-link:hover { color: var(--gold); }
    .cr-btn-gold {
      background: var(--gold); color: #14110a; border: none; cursor: pointer;
      font-family: 'Jost', sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 1px;
      text-transform: uppercase; padding: 13px 22px; border-radius: var(--radius);
      transition: transform 0.16s, box-shadow 0.16s, opacity 0.16s;
    }
    .cr-btn-gold:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 8px 26px rgba(200,162,74,0.28); }
    .cr-btn-block { width: 100%; margin-top: 8px; }

    /* ─── STAGES ─── */
    .cr-stage { padding: 44px 28px 60px; }
    .cr-step-tag {
      display: block; font-size: 10px; letter-spacing: 4px; text-transform: uppercase;
      color: var(--gold); margin-bottom: 14px;
    }
    .cr-journey { max-width: 560px; margin: 0 auto; text-align: center; }
    .cr-display-h1 {
      font-family: var(--font-display); font-weight: var(--disp-weight);
      letter-spacing: var(--disp-spacing); text-transform: var(--disp-transform);
      font-size: clamp(30px, 5vw, 46px); line-height: 1.15; color: var(--cream); margin-bottom: 12px;
    }
    .cr-lede { font-size: 14px; color: var(--muted); line-height: 1.75; max-width: 400px; margin: 0 auto 34px; }
    .cr-journey-list { display: flex; flex-direction: column; gap: 12px; text-align: left; }
    .cr-journey-card {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 20px 24px; background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius); cursor: pointer; font-family: 'Jost', sans-serif;
      transition: border-color 0.2s, transform 0.15s, background 0.2s; position: relative;
    }
    .cr-journey-card::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
      background: var(--gold); transform: scaleY(0); transform-origin: top; transition: transform 0.22s;
    }
    .cr-journey-card:hover { border-color: var(--gold-deep); transform: translateY(-2px); background: var(--surface-2); }
    .cr-journey-card:hover::before { transform: scaleY(1); }
    .cr-journey-title { font-size: 16px; font-weight: 500; color: var(--cream); margin-bottom: 5px; }
    .cr-journey-desc { font-size: 12.5px; color: var(--muted); line-height: 1.55; }
    .cr-journey-arrow { color: var(--gold); font-size: 18px; flex-shrink: 0; }

    /* ─── DETAILS FORM ─── */
    .cr-details { display: flex; gap: 40px; flex-wrap: wrap; align-items: flex-start; justify-content: center; max-width: 820px; margin: 0 auto; }
    .cr-guide { width: 300px; flex-shrink: 0; }
    .cr-guide-h { font-family: var(--font-display); font-weight: var(--disp-weight); letter-spacing: var(--disp-spacing); text-transform: var(--disp-transform); font-size: 26px; line-height: 1.25; color: var(--cream); margin-bottom: 8px; }
    .cr-guide-p { font-size: 13px; color: var(--muted); line-height: 1.75; margin-bottom: 26px; }
    .cr-steps { display: flex; flex-direction: column; gap: 16px; }
    .cr-step { display: flex; gap: 13px; align-items: flex-start; }
    .cr-step-num {
      width: 30px; height: 30px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--gold-deep); color: var(--gold); font-family: var(--font-display);
      font-size: 12px; letter-spacing: 1px; border-radius: 50%;
    }
    #cr-root[data-direction="monogram"] .cr-step-num { border-radius: 0; }
    .cr-step-t { font-size: 13px; font-weight: 500; color: var(--cream); margin-bottom: 2px; }
    .cr-step-b { font-size: 12px; color: var(--muted); line-height: 1.6; }
    .cr-note {
      padding: 12px 15px; border-radius: var(--radius); background: rgba(200,162,74,0.06);
      border: 1px solid rgba(200,162,74,0.2); font-size: 11.5px; color: var(--muted); line-height: 1.65;
    }
    .cr-note strong { color: var(--gold); font-weight: 500; }
    .cr-note-wide { margin-top: 4px; }
    .cr-form {
      width: 420px; max-width: 100%; background: var(--surface); border: 1px solid var(--line-2);
      border-radius: var(--radius); padding: 30px 28px; position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
    .cr-form::before, .cr-form::after {
      content: ""; position: absolute; width: 14px; height: 14px; border: 1px solid var(--gold-deep);
    }
    .cr-form::before { top: 8px; left: 8px; border-right: none; border-bottom: none; }
    .cr-form::after  { bottom: 8px; right: 8px; border-left: none; border-top: none; }
    #cr-root[data-ornaments="off"] .cr-form::before,
    #cr-root[data-ornaments="off"] .cr-form::after { display: none; }
    .cr-form-head { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; margin-bottom: 4px; }
    .cr-form-head > .cr-form-title { flex: 1; min-width: 0; }
    .cr-form-title { font-family: var(--font-display); font-weight: var(--disp-weight); letter-spacing: var(--disp-spacing); text-transform: var(--disp-transform); font-size: 18px; color: var(--cream); line-height: 1.25; }
    .cr-form-sub { font-size: 12px; color: var(--muted); margin-bottom: 22px; }

    /* ─── INPUTS ─── */
    .cr-field-label {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 10px; font-weight: 500; letter-spacing: 1.2px; text-transform: uppercase;
      color: var(--faint); margin-bottom: 6px;
    }
    .cr-field-label.cr-err { color: var(--neg); }
    .cr-opt { font-weight: 400; text-transform: none; letter-spacing: 0; margin-left: 5px; color: var(--faint); }
    .cr-err-tag { font-size: 9px; color: var(--neg); }
    .cr-input {
      width: 100%; padding: 11px 14px; background: var(--bg);
      border: 1px solid var(--line-2); border-radius: var(--radius);
      font-size: 14px; color: var(--ink); font-family: 'Jost', sans-serif; transition: border-color 0.18s, background 0.18s;
    }
    .cr-input:focus { border-color: var(--gold); background: rgba(200,162,74,0.04); }
    .cr-input-err { border-color: var(--neg); }
    .cr-money-sym { position: absolute; left: 13px; font-size: 14px; color: var(--faint); pointer-events: none; }
    .cr-money-suffix { position: absolute; right: 14px; font-size: 12px; color: var(--faint); pointer-events: none; }
    .cr-hint { font-size: 11px; color: var(--faint); margin-top: 5px; line-height: 1.5; }

    /* ─── SLIDER ─── */
    .cr-slider-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
    .cr-slider-val { font-family: var(--font-display); font-size: 15px; color: var(--cream); letter-spacing: 0.5px; }
    .cr-track { position: relative; height: 4px; background: var(--line-2); border-radius: 2px; margin: 8px 0 4px; }
    .cr-track-fill { position: absolute; height: 100%; background: var(--gold); border-radius: 2px; pointer-events: none; }
    .cr-range { position: absolute; top: 50%; left: 0; width: 100%; height: 4px; transform: translateY(-50%); background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; }
    .cr-range::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: var(--gold); border: 2px solid var(--bg); cursor: pointer; transform: rotate(45deg); }
    .cr-range::-moz-range-thumb { width: 14px; height: 14px; background: var(--gold); border: 2px solid var(--bg); cursor: pointer; border-radius: 0; }
    #cr-root[data-direction="savoy"] .cr-range::-webkit-slider-thumb { border-radius: 50%; transform: none; }
    #cr-root[data-direction="savoy"] .cr-range::-moz-range-thumb { border-radius: 50%; }
    .cr-track-ends { display: flex; justify-content: space-between; font-size: 10px; color: var(--faint); }

    /* ─── PILLS / TOGGLE ─── */
    .cr-pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .cr-pill {
      padding: 6px 13px; border-radius: 40px; font-size: 11px; font-weight: 400; cursor: pointer;
      border: 1px solid var(--line-2); background: var(--bg); color: var(--muted); font-family: 'Jost', sans-serif; transition: all 0.16s;
    }
    .cr-pill-on { border-color: var(--gold); background: var(--gold); color: #14110a; font-weight: 500; }
    .cr-toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; }
    .cr-switch { width: 34px; height: 18px; border-radius: 10px; background: var(--line-2); border: none; cursor: pointer; position: relative; transition: background 0.2s; }
    .cr-switch span { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--cream); top: 3px; left: 3px; transition: left 0.2s; }
    .cr-switch-on { background: var(--gold); }
    .cr-switch-on span { left: 19px; }

    /* ─── DASHBOARD ─── */
    .cr-tabs {
      display: flex; overflow-x: auto; border-bottom: 1px solid var(--line);
      position: sticky; top: 0; z-index: 40; background: var(--bg);
      padding: 0 16px;
    }
    .cr-tab {
      padding: 13px 16px; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase;
      color: var(--muted); border: none; background: none; cursor: pointer; white-space: nowrap;
      font-family: 'Jost', sans-serif; border-bottom: 2px solid transparent; transition: color 0.16s;
    }
    .cr-tab:hover { color: var(--cream); }
    .cr-tab-on { color: var(--gold); border-bottom-color: var(--gold); }
    .cr-content { padding: 22px 24px; display: flex; flex-direction: column; gap: 16px; }

    /* ─── VERDICT ─── */
    .cr-verdict { border-radius: var(--radius); padding: 16px 20px; border: 1px solid; }
    .cr-verdict-ok { background: rgba(132,201,165,0.08); border-color: rgba(132,201,165,0.3); }
    .cr-verdict-warn { background: rgba(226,156,129,0.08); border-color: rgba(226,156,129,0.3); }
    .cr-verdict-main { font-size: 14px; font-weight: 500; }
    .cr-verdict-ok .cr-verdict-main { color: var(--pos); }
    .cr-verdict-warn .cr-verdict-main { color: var(--neg); }
    .cr-verdict-sub { font-size: 11.5px; color: var(--muted); margin-top: 3px; }

    /* ─── TILES ─── */
    .cr-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
    .cr-tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 15px; position: relative; overflow: hidden; }
    .cr-tile-accent { border-color: rgba(200,162,74,0.35); }
    .cr-tile-label { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--faint); margin-bottom: 6px; }
    .cr-tile-val { font-family: var(--font-display); font-weight: var(--disp-weight); font-size: 22px; letter-spacing: 0.5px; color: var(--ink); line-height: 1.1; white-space: nowrap; }
    .cr-tile-accent .cr-tile-val { color: var(--gold); }
    .cr-tile-pos .cr-tile-val { color: var(--pos); }
    .cr-tile-neg .cr-tile-val { color: var(--neg); }
    .cr-tile-sub { font-size: 10.5px; color: var(--muted); margin-top: 5px; }

    /* ─── CARD ─── */
    .cr-grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 16px; }
    .cr-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
    .cr-card-accent { border-top: 2px solid var(--card-accent, var(--gold)); }
    .cr-card-head {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 14px;
      padding: 16px 18px 12px; border-bottom: 1px solid var(--line);
    }
    .cr-card-head > div:first-child { flex: 1; min-width: 0; }
    .cr-card-title { font-family: var(--font-display); font-weight: var(--disp-weight); letter-spacing: var(--disp-spacing); text-transform: var(--disp-transform); font-size: 15px; color: var(--cream); line-height: 1.3; }
    #cr-root[data-direction="monogram"] .cr-card-title { font-size: 13px; }
    .cr-card-sub { font-size: 11px; color: var(--muted); margin-top: 5px; line-height: 1.45; }
    .cr-card-body { padding: 16px 18px; }

    /* ─── ORNAMENTS ─── */
    #cr-root[data-ornaments="off"] .cr-fan,
    #cr-root[data-ornaments="off"] .cr-diamond { display: none; }
    .cr-fan { flex-shrink: 0; opacity: 0.9; }
    #cr-root[data-direction="monogram"] .cr-fan { display: none; }

    /* ─── ROWS ─── */
    .cr-row { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--line); }
    .cr-row:last-child { border-bottom: none; }
    .cr-row-hl { background: rgba(200,162,74,0.07); margin: 4px -18px 0; padding: 11px 18px; border-bottom: none; border-top: 1px solid var(--line); }
    .cr-row-label { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
    .cr-row-hl .cr-row-label { color: var(--cream); font-weight: 500; }
    .cr-row-right { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0; }
    .cr-row-sub { font-size: 10px; color: var(--faint); line-height: 1.3; }
    .cr-row-val { font-size: 13px; font-weight: 500; color: var(--ink); line-height: 1.3; white-space: nowrap; }
    .cr-row-hl .cr-row-val { font-family: var(--font-display); font-size: 15px; color: var(--gold); }
    .cr-accent { color: var(--gold) !important; }
    .cr-pos { color: var(--pos) !important; }
    .cr-neg { color: var(--neg) !important; }
    .cr-sage { color: var(--sage) !important; }
    .cr-muted { color: var(--muted) !important; }

    /* ─── DONUT ─── */
    .cr-donut-layout { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
    .cr-donut-wrap { position: relative; flex-shrink: 0; margin: 0 auto; }
    .cr-donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .cr-donut-c-label { font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--faint); }
    .cr-donut-c-val { font-family: var(--font-display); font-weight: var(--disp-weight); font-size: 20px; color: var(--gold); margin-top: 2px; }
    .cr-legend { flex: 1; min-width: 180px; display: flex; flex-direction: column; gap: 4px; }
    .cr-legend-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--line); }
    .cr-legend-dot { width: 9px; height: 9px; flex-shrink: 0; }
    #cr-root[data-direction="savoy"] .cr-legend-dot { border-radius: 50%; }
    .cr-legend-label { font-size: 11.5px; color: var(--muted); flex: 1; }
    .cr-legend-pct { font-size: 10px; color: var(--faint); width: 32px; text-align: right; }
    .cr-legend-val { font-size: 11.5px; color: var(--ink); width: 64px; text-align: right; font-weight: 500; }

    /* ─── MISC DASHBOARD BITS ─── */
    .cr-alert { border-radius: var(--radius); padding: 11px 15px; background: rgba(226,156,129,0.07); border: 1px solid rgba(226,156,129,0.25); font-size: 12px; color: var(--neg); }
    .cr-edit-link { align-self: flex-start; border: 1px solid var(--line-2); border-radius: var(--radius); padding: 6px 13px; }
    .cr-bar { height: 6px; border-radius: 3px; background: var(--line-2); overflow: hidden; margin-top: 4px; }
    .cr-bar-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--sage)); }
    .cr-bignum { text-align: center; padding: 14px 0 16px; }
    .cr-bignum-label { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--faint); margin-bottom: 6px; }
    .cr-bignum-val { font-family: var(--font-display); font-weight: var(--disp-weight); font-size: 38px; color: var(--gold); line-height: 1; letter-spacing: 0.5px; }
    .cr-afford { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
    .cr-lti { flex: 1; min-width: 200px; padding: 12px 15px; border-radius: var(--radius); border: 1px solid; }
    .cr-lti-ok { background: rgba(132,201,165,0.07); border-color: rgba(132,201,165,0.25); }
    .cr-lti-warn { background: rgba(226,156,129,0.07); border-color: rgba(226,156,129,0.25); }
    .cr-lti-val { font-family: var(--font-display); font-weight: var(--disp-weight); font-size: 20px; margin: 2px 0; }
    .cr-lti-ok .cr-lti-val { color: var(--pos); }
    .cr-lti-warn .cr-lti-val { color: var(--neg); }

    /* ─── STAMP DUTY BANDS ─── */
    .cr-band { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .cr-band-label { font-size: 11px; color: var(--muted); width: 148px; flex-shrink: 0; }
    .cr-band-bar { flex: 1; height: 4px; background: var(--line-2); border-radius: 2px; }
    .cr-band-fill { height: 100%; background: var(--sage); border-radius: 2px; }
    .cr-band-rate { font-size: 11px; font-weight: 500; color: var(--sage); width: 30px; text-align: right; }
    .cr-band-tax { font-size: 11px; font-weight: 500; color: var(--ink); width: 68px; text-align: right; }

    /* ─── SCENARIOS ─── */
    .cr-scen-head { display: flex; justify-content: space-between; align-items: center; }
    .cr-reset { border: 1px solid var(--line-2); border-radius: var(--radius); padding: 5px 11px; }
    .cr-scen-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(255px, 1fr)); gap: 12px; }
    .cr-scen-lever { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 15px; }
    .cr-lever-label { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--faint); margin-bottom: 6px; }
    .cr-scen-summary-head { padding: 13px 18px; border-bottom: 1px solid var(--line); font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--faint); }
    .cr-scen-3col { display: grid; grid-template-columns: 1fr 1fr 1fr; }
    .cr-scen-col { padding: 18px 14px; text-align: center; border-right: 1px solid var(--line); }

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

  <script type="text/babel" data-presets="react">
    // ─── TWEAKS PANEL ────────────────────────────────────────────────────────────
    const __TWEAKS_STYLE = `

        padding:0;border:0;border-radius:6px;overflow:hidden;cursor:default;
        box-shadow:0 0 0 .5px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.06);
        transition:transform .12s cubic-bezier(.3,.7,.4,1),box-shadow .12s}
      .twk-chip:hover{transform:translateY(-1px);
        box-shadow:0 0 0 .5px rgba(0,0,0,.18),0 4px 10px rgba(0,0,0,.12)}
      .twk-chip[data-on="1"]{box-shadow:0 0 0 1.5px rgba(0,0,0,.85),0 2px 6px rgba(0,0,0,.15)}
      .twk-chip>span{position:absolute;top:0;bottom:0;right:0;width:34%;
        display:flex;flex-direction:column;box-shadow:-1px 0 0 rgba(0,0,0,.1)}
      .twk-chip>span>i{flex:1;box-shadow:0 -1px 0 rgba(0,0,0,.1)}
      .twk-chip>span>i:first-child{box-shadow:none}

        filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}

    function useTweaks(defaults) {
      const [values, setValues] = React.useState(defaults);
      const setTweak = React.useCallback((keyOrEdits, val) => {
        const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
          ? keyOrEdits : { [keyOrEdits]: val };
        setValues((prev) => ({ ...prev, ...edits }));
        window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
        window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
      }, []);
      return [values, setTweak];
    }

    function TweaksPanel({ title = 'Tweaks', children }) {
      const [open, setOpen] = React.useState(false);
      const dragRef = React.useRef(null);
      const offsetRef = React.useRef({ x: 16, y: 16 });
      const PAD = 16;

      const clampToViewport = React.useCallback(() => {
        const panel = dragRef.current;
        if (!panel) return;
        const w = panel.offsetWidth, h = panel.offsetHeight;
        const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
        const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
        offsetRef.current = {
          x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
          y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
        };
        panel.style.right = offsetRef.current.x + 'px';
        panel.style.bottom = offsetRef.current.y + 'px';
      }, []);

      React.useEffect(() => {
        if (!open) return;
        clampToViewport();
        if (typeof ResizeObserver === 'undefined') {
          window.addEventListener('resize', clampToViewport);
          return () => window.removeEventListener('resize', clampToViewport);
        }
        const ro = new ResizeObserver(clampToViewport);
        ro.observe(document.documentElement);
        return () => ro.disconnect();
      }, [open, clampToViewport]);

      React.useEffect(() => {
        const onMsg = (e) => {
          const t = e?.data?.type;
          if (t === '__activate_edit_mode') setOpen(true);
          else if (t === '__deactivate_edit_mode') setOpen(false);
        };
        window.addEventListener('message', onMsg);
        window.parent.postMessage({ type: '__edit_mode_available' }, '*');
        return () => window.removeEventListener('message', onMsg);
      }, []);

      const dismiss = () => {
        setOpen(false);
        window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
      };

      const onDragStart = (e) => {
        const panel = dragRef.current;
        if (!panel) return;
        const r = panel.getBoundingClientRect();
        const sx = e.clientX, sy = e.clientY;
        const startRight = window.innerWidth - r.right;
        const startBottom = window.innerHeight - r.bottom;
        const move = (ev) => {
          offsetRef.current = {
            x: startRight - (ev.clientX - sx),
            y: startBottom - (ev.clientY - sy),
          };
          clampToViewport();
        };
        const up = () => {
          window.removeEventListener('mousemove', move);
          window.removeEventListener('mouseup', up);
        };
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', up);
      };

      if (!open) return null;
      return (
        <>
          <style>{__TWEAKS_STYLE}</style>
          <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
            <div className="twk-hd" onMouseDown={onDragStart}>
              <b>{title}</b>
              <button className="twk-x" aria-label="Close tweaks" onMouseDown={(e) => e.stopPropagation()} onClick={dismiss}>✕</button>
            </div>
            <div className="twk-body">{children}</div>
          </div>
        </>
      );
    }

    function TweakSection({ label }) {
      return <div className="twk-sect">{label}</div>;
    }

    function TweakRow({ label, value, children, inline = false }) {
      return (
        <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
          <div className="twk-lbl">
            <span>{label}</span>
            {value != null && <span className="twk-val">{value}</span>}
          </div>
          {children}
        </div>
      );
    }

    function TweakToggle({ label, value, onChange }) {
      return (
        <div className="twk-row twk-row-h">
          <div className="twk-lbl"><span>{label}</span></div>
          <button type="button" className="twk-toggle" data-on={value ? '1' : '0'} role="switch" aria-checked={!!value} onClick={() => onChange(!value)}><i /></button>
        </div>
      );
    }

    function TweakRadio({ label, value, options, onChange }) {
      const trackRef = React.useRef(null);
      const [dragging, setDragging] = React.useState(false);
      const valueRef = React.useRef(value);
      valueRef.current = value;

      const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
      const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
      const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);

      if (!fitsAsSegments) {
        return (
          <TweakRow label={label}>
            <select className="twk-field" value={value} onChange={(e) => {
              const s = e.target.value;
              const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
              onChange(m === undefined ? s : typeof m === 'object' ? m.value : m);
            }}>
              {options.map((o) => {
                const v = typeof o === 'object' ? o.value : o;
                const l = typeof o === 'object' ? o.label : o;
                return <option key={v} value={v}>{l}</option>;
              })}
            </select>
          </TweakRow>
        );
      }

      const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
      const idx = Math.max(0, opts.findIndex((o) => o.value === value));
      const n = opts.length;

      const segAt = (clientX) => {
        const r = trackRef.current.getBoundingClientRect();
        const inner = r.width - 4;
        const i = Math.floor(((clientX - r.left - 2) / inner) * n);
        return opts[Math.max(0, Math.min(n - 1, i))].value;
      };

      const onPointerDown = (e) => {
        setDragging(true);
        const v0 = segAt(e.clientX);
        if (v0 !== valueRef.current) onChange(v0);
        const move = (ev) => { if (!trackRef.current) return; const v = segAt(ev.clientX); if (v !== valueRef.current) onChange(v); };
        const up = () => { setDragging(false); window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      };

      return (
        <TweakRow label={label}>
          <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown} className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
            <div className="twk-seg-thumb" style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`, width: `calc((100% - 4px) / ${n})` }} />
            {opts.map((o) => (
              <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>{o.label}</button>
            ))}
          </div>
        </TweakRow>
      );
    }

    function __twkIsLight(hex) {
      const h = String(hex).replace('#', '');
      const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
      const n = parseInt(x.slice(0, 6), 16);
      if (Number.isNaN(n)) return true;
      const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
      return r * 299 + g * 587 + b * 114 > 148000;
    }

    const __TwkCheck = ({ light }) => (
      <svg viewBox="0 0 14 14" aria-hidden="true">
        <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
      </svg>
    );

    function TweakColor({ label, value, options, onChange }) {
      if (!options || !options.length) {
        return (
          <div className="twk-row twk-row-h">
            <div className="twk-lbl"><span>{label}</span></div>
            <input type="color" className="twk-swatch" value={value} onChange={(e) => onChange(e.target.value)} />
          </div>
        );
      }
      const key = (o) => String(JSON.stringify(o)).toLowerCase();
      const cur = key(value);
      return (
        <TweakRow label={label}>
          <div className="twk-chips" role="radiogroup">
            {options.map((o, i) => {
              const colors = Array.isArray(o) ? o : [o];
              const [hero, ...rest] = colors;
              const sup = rest.slice(0, 4);
              const on = key(o) === cur;
              return (
                <button key={i} type="button" className="twk-chip" role="radio" aria-checked={on} data-on={on ? '1' : '0'}
                  aria-label={colors.join(', ')} title={colors.join(' · ')} style={{ background: hero }} onClick={() => onChange(o)}>
                  {sup.length > 0 && <span>{sup.map((c, j) => <i key={j} style={{ background: c }} />)}</span>}
                  {on && <__TwkCheck light={__twkIsLight(hero)} />}
                </button>
              );
            })}
          </div>
        </TweakRow>
      );
    }

    // ─── CALCULATION ENGINE ───────────────────────────────────────────────────────
    const MARKET_RATE = 4.35;
    const STRESS_DELTA = 3;
    const LTI_CAP = 4.5;

    function calcSDLT(price, buyerType) {
      if (price <= 0) return { total: 0, bands: [] };
      let bands = [], type = buyerType;
      if (type === "firstTime") {
        if (price > 500000) { type = "standard"; }
        else {
          const b2 = Math.max(0, Math.min(price, 500000) - 300000);
          return { total: b2 * 0.05, bands: [
            { label: "£0 – £300,000", rate: 0, tax: 0 },
            ...(b2 > 0 ? [{ label: "£300,001 – £500,000", rate: 5, tax: b2 * 0.05 }] : [])
          ]};
        }
      }
      if (type === "standard") {
        const T = [{ limit: 125000, rate: 0 },{ limit: 250000, rate: 2 },{ limit: 925000, rate: 5 },{ limit: 1500000, rate: 10 },{ limit: Infinity, rate: 12 }];
        const L = ["£0 – £125,000","£125,001 – £250,000","£250,001 – £925,000","£925,001 – £1,500,000","Above £1,500,000"];
        let prev = 0;
        T.forEach(({ limit, rate }, i) => { if (price > prev) { const t = Math.min(price, limit) - prev; if (t > 0) bands.push({ label: L[i], rate, tax: t * rate / 100 }); prev = limit; } });
        return { total: bands.reduce((s, b) => s + b.tax, 0), bands };
      }
      if (type === "additional") {
        const T = [{ limit: 125000, r: 5 },{ limit: 250000, r: 7 },{ limit: 925000, r: 10 },{ limit: 1500000, r: 15 },{ limit: Infinity, r: 17 }];
        const L = ["£0 – £125,000","£125,001 – £250,000","£250,001 – £925,000","£925,001 – £1,500,000","Above £1,500,000"];
        let prev = 0;
        T.forEach(({ limit, r }, i) => { if (price > prev) { const t = Math.min(price, limit) - prev; if (t > 0) bands.push({ label: L[i], rate: r, tax: t * r / 100 }); prev = limit; } });
        return { total: bands.reduce((s, b) => s + b.tax, 0), bands };
      }
      return { total: 0, bands: [] };
    }

    function calcMortgage(principal, annualRate, years) {
      if (!principal || principal <= 0 || !years) return { monthly: 0, total: 0, interest: 0 };
      const r = annualRate / 100 / 12, n = years * 12;
      if (r === 0) return { monthly: principal / n, total: principal, interest: 0 };
      const monthly = (principal * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
      return { monthly, total: monthly * n, interest: monthly * n - principal };
    }

    function fmt(n) {
      if (n === undefined || n === null || isNaN(n)) return "£0";
      const abs = Math.abs(Math.round(n));
      return (n < 0 ? "-£" : "£") + abs.toLocaleString("en-GB");
    }
    function fmtPct(n) { return (Math.round(n * 100) / 100) + "%"; }

    const JOURNEYS = {
      ftb: { label: "My first home", desc: "Buying for the first time — no property to sell, first-time buyer stamp duty relief.", badge: "First-Time Buyer", buyerType: "firstTime", hasSale: false },
      mover: { label: "Moving home", desc: "Selling my current property and buying the next one — the classic chain.", badge: "Home Mover", buyerType: "standard", hasSale: true },
      additional: { label: "An additional property", desc: "Buying while keeping my current property — second home or buy-to-let. +5% stamp duty applies.", badge: "Additional Property", buyerType: "additional", hasSale: false },
    };

    // ─── UI COMPONENTS ────────────────────────────────────────────────────────────
    function Ornament({ kind = "rule", style }) {
      if (kind === "fan") {
        return (
          <svg className="cr-fan" width="42" height="20" viewBox="0 0 42 20" style={style} aria-hidden="true">
            {[0,1,2,3,4,5,6].map(i => (
              <line key={i} x1="21" y1="20" x2={3 + i*5.7} y2="2" stroke="var(--gold)" strokeWidth="1" opacity={0.35 + Math.abs(3-i)*0.12} />
            ))}
          </svg>
        );
      }
      return null;
    }

    function MoneyInput({ value, onChange, placeholder, error, suffix }) {
      const display = value === "" || value === 0 ? "" : Number(value).toLocaleString("en-GB");
      return (
        <div className="cr-money" style={{ position: "relative", display: "flex", alignItems: "center" }}>
          {!suffix && <span className="cr-money-sym">£</span>}
          <input
            type="text" inputMode="numeric" placeholder={placeholder} value={display}
            className={"cr-input" + (error ? " cr-input-err" : "")}
            style={{ paddingLeft: suffix ? 14 : 28, paddingRight: suffix ? 42 : 14 }}
            onChange={e => { const raw = e.target.value.replace(/[^0-9]/g, ""); onChange(raw === "" ? "" : Number(raw)); }}
          />
          {suffix && <span className="cr-money-suffix">{suffix}</span>}
        </div>
      );
    }

    function NumInput({ label, value, onChange }) {
      return (
        <div style={{ marginBottom: 12 }}>
          <label className="cr-field-label">{label}</label>
          <input type="number" value={value} onChange={e => onChange(Number(e.target.value))} className="cr-input" />
        </div>
      );
    }

    function SliderInput({ label, value, onChange, min, max, step = 1000, prefix = "£", suffix = "", hint }) {
      const pct = Math.min(100, Math.max(0, ((value - min) / (max - min)) * 100));
      return (

    function Donut({ segments, centerLabel, centerValue, size = 200 }) {
      const total = segments.reduce((s, x) => s + Math.max(0, x.value), 0) || 1;
      const r = size / 2 - 16;
      const cx = size / 2, cy = size / 2;
      const circ = 2 * Math.PI * r;
      let offset = 0;
      const arcs = segments.map((seg, i) => {
        const frac = Math.max(0, seg.value) / total;
        const len = frac * circ;
        const arc = (
          <circle key={i} cx={cx} cy={cy} r={r} fill="none"
            stroke={seg.color} strokeWidth="16"
            strokeDasharray={`${len} ${circ - len}`}
            strokeDashoffset={-offset}
            transform={`rotate(-90 ${cx} ${cy})`}
            style={{ transition: "stroke-dasharray 0.5s ease, stroke-dashoffset 0.5s ease" }} />
        );
        offset += len;
        return arc;
      });
      return (
        <div className="cr-donut-wrap">
          <svg width={size} height={size} className="cr-donut">
            <circle cx={cx} cy={cy} r={r} fill="none" stroke="var(--line)" strokeWidth="16" />
            {arcs}
            <circle cx={cx} cy={cy} r={r - 22} fill="none" stroke="var(--gold)" strokeWidth="0.75" opacity="0.4" />
          </svg>
          <div className="cr-donut-center">
            <div className="cr-donut-c-label">{centerLabel}</div>
            <div className="cr-donut-c-val">{centerValue}</div>
          </div>
        </div>
      );
    }

    function Legend({ segments }) {
      const total = segments.reduce((s, x) => s + Math.max(0, x.value), 0) || 1;
      return (
        <div className="cr-legend">

            <div key={i} className="cr-legend-row">

              <span className="cr-legend-pct">{Math.round(s.value / total * 100)}%</span>
              <span className="cr-legend-val">{fmt(s.value)}</span>
            </div>

      );
    }

                    </div>
                    <div className="cr-verdict-sub">
                      {hasSale ? "Based on your purchase and sale together" : "Based on your savings against deposit and all buying costs"} · Stress-test on the Scenarios tab
                    </div>
                  </div>

                  <div className="cr-tiles">
                    <StatTile label="Offer Price" value={fmt(offerPrice)} sub={JOURNEYS[journey].badge} tone="accent" />
                    <StatTile label="Deposit" value={fmt(depositAmount)} sub={`${depositPct}% · LTV ${fmtPct(ltv)}`} />
                    <StatTile label="Stamp Duty" value={fmt(sdlt.total)} sub={buyerType === "firstTime" ? "FTB relief applied" : buyerType === "additional" ? "+5% surcharge" : "Standard rates"} />
                    <StatTile label="Monthly Payment" value={fmt(mortgage.monthly)} sub={`${fmtPct(mortgageRate)} · ${mortgageTerm}yr`} />
                    {hasSale
                      ? <StatTile label="Net Sale Proceeds" value={fmt(netSaleProceeds)} sub={`Equity ${fmt(saleEquity)}`} />
                      : <StatTile label="Total Cash Needed" value={fmt(totalCashNeeded)} sub="Deposit + all costs" />}
                    <StatTile label="Surplus / Deficit" value={(surplus >= 0 ? "+" : "") + fmt(surplus)} sub="After all costs" tone={surplus >= 0 ? "pos" : "neg"} />
                  </div>

                  <div className="cr-grid-2">
                    <Card title="Where your cash goes" subtitle="Total cash needed to buy" accent="var(--clay)">
                      <div className="cr-donut-layout">
                        <Donut segments={costSegments} centerLabel="Total needed" centerValue={fmt(totalCashNeeded)} />
                        <Legend segments={costSegments} />
                      </div>
                    </Card>
                    <Card title="Cash Available" accent="var(--sage)">
                      {hasSale && (<React.Fragment>
                        <CostRow label="Sale Price" value={salePrice} />
                        <CostRow label="Agent Fee" value={-agentFeeTotal} sub={`${agentFeePct}%${agentFeeVAT ? " +VAT" : ""}`} />
                        <CostRow label="Solicitor (sale)" value={-sellerSolicitorFee} />
                        <CostRow label="Mortgage Repaid" value={-existingMortgage} />
                        <CostRow label="Net from Sale" value={netSaleProceeds} highlight />
                        <div style={{ height: 8 }} />
                      </React.Fragment>)}
                      <CostRow label="Savings" value={savings} />
                      <CostRow label="TOTAL AVAILABLE" value={cashAvailable} highlight />
                    </Card>
                  </div>

                  {lti !== null && lti > LTI_CAP && (
                    <div className="cr-alert">Heads-up: your loan is {lti.toFixed(1)}× your income — most lenders cap at ~{LTI_CAP}×. See the Mortgage tab.</div>
                  )}

                  <div className="cr-note cr-note-wide">
                    <strong>SDLT (England &amp; NI, post April 2025):</strong> 0% to £125k · 2% to £250k · 5% to £925k · 10% to £1.5m · 12% above. First-time buyers: 0% to £300k (relief up to £500k). Additional property: +5% on every band.
                  </div>
                  <button onClick={() => setStage("details")} className="cr-link cr-edit-link">← Edit my numbers</button>
                </React.Fragment>)}

                {/* PURCHASE */}
                {tab === "purchase" && (<React.Fragment>
                  <Card title="Purchase Details">
                    <SliderInput label="Offer / Purchase Price" value={offerPrice} onChange={setOfferPrice} min={100000} max={3000000} step={5000} />
                    <SliderInput label="Deposit" value={depositPct} onChange={setDepositPct} min={5} max={60} step={1} prefix="" suffix="%" />
                  </Card>
                  <div className="cr-grid-2">
                    <Card title="Deposit & Loan">
                      <CostRow label="Offer Price" value={offerPrice} />
                      <CostRow label="Deposit" value={depositAmount} sub={`${depositPct}%`} />
                      <CostRow label="Mortgage Required" value={mortgageLoan} highlight />
                      <div style={{ marginTop: 14 }}>
                        <div className="cr-hint">Loan-to-value: {fmtPct(ltv)}</div>
                        <div className="cr-bar"><div className="cr-bar-fill" style={{ width: `${Math.min(100, ltv)}%` }} /></div>
                        <div className="cr-hint" style={{ marginTop: 4 }}>
                          {ltv > 90 ? "Above 90% LTV — fewer products, higher rates" : ltv > 75 ? "75–90% LTV — mainstream territory" : "Below 75% LTV — access to the best rates"}
                        </div>
                      </div>
                    </Card>
                    <Card title="Buying Costs" subtitle="Adjust to match your quotes">
                      <NumInput label="Solicitor / conveyancing (£)" value={buyerSolicitorFee} onChange={setBuyerSolicitorFee} />
                      <NumInput label="Survey (£)" value={surveyFee} onChange={setSurveyFee} />
                      <NumInput label="Mortgage arrangement (£)" value={mortgageArrangement} onChange={setMortgageArrangement} />
                      <NumInput label="Removals (£)" value={removals} onChange={setRemovals} />
                      <NumInput label="Other (£)" value={otherCosts} onChange={setOtherCosts} />
                    </Card>
                  </div>
                  {!hasSale && <Card title="Savings"><NumInput label="Savings available (£)" value={savings} onChange={setSavings} /></Card>}
                </React.Fragment>)}

                {/* SALE */}
                {tab === "sale" && hasSale && (<React.Fragment>
                  <Card title="Your Current Property Sale">
                    <SliderInput label="Expected Sale Price" value={salePrice} onChange={setSalePrice} min={100000} max={2000000} step={5000} />
                    <SliderInput label="Existing Mortgage" value={existingMortgage} onChange={setExistingMortgage} min={0} max={Math.max(100000, salePrice)} step={5000} hint={`Equity: ${fmt(saleEquity)}`} />
                    <SliderInput label="Agent Fee" value={agentFeePct} onChange={setAgentFeePct} min={0.5} max={3.5} step={0.1} prefix="" suffix="%" hint="Typical UK: 1.0–2.0% + VAT" />
                    <div className="cr-toggle-row">
                      <span className="cr-hint" style={{ margin: 0 }}>Agent fee includes VAT (20%)</span>
                      <button onClick={() => setAgentFeeVAT(v => !v)} className={"cr-switch" + (agentFeeVAT ? " cr-switch-on" : "")}><span /></button>
                    </div>
                    <div style={{ marginTop: 12 }}>
                      <NumInput label="Solicitor — sale side (£)" value={sellerSolicitorFee} onChange={setSellerSolicitorFee} />
                      <NumInput label="Additional savings (£)" value={savings} onChange={setSavings} />
                    </div>
                  </Card>
                  <Card title="Sale Proceeds Breakdown">
                    <CostRow label="Gross Sale Price" value={salePrice} />
                    <CostRow label="Agent Fee (excl VAT)" value={-agentFeeBase} sub={`${agentFeePct}%`} />
                    {agentFeeVAT && <CostRow label="VAT on Agent Fee" value={-(agentFeeTotal - agentFeeBase)} />}
                    <CostRow label="Solicitor (sale)" value={-sellerSolicitorFee} />
                    <CostRow label="Mortgage Repaid" value={-existingMortgage} />
                    <CostRow label="Net Cash from Sale" value={netSaleProceeds} highlight />
                  </Card>
                </React.Fragment>)}

                {/* MORTGAGE */}
                {tab === "mortgage" && (<React.Fragment>
                  <Card title="Mortgage Calculator" subtitle={`Rate pre-filled at ${MARKET_RATE}% — best 5-yr fixed, May 2026 (HomeOwners Alliance / L&C). Adjust to your quote.`}>
                    <SliderInput label="Interest Rate" value={mortgageRate} onChange={setMortgageRate} min={1} max={10} step={0.05} prefix="" suffix="%" />
                    <SliderInput label="Term" value={mortgageTerm} onChange={setMortgageTerm} min={5} max={40} step={1} prefix="" suffix=" years" />
                  </Card>
                  <div className="cr-grid-2">
                    <Card title="Monthly Repayment">
                      <div className="cr-bignum">
                        <div className="cr-bignum-label">Monthly Payment</div>
                        <div className="cr-bignum-val">{fmt(mortgage.monthly)}</div>
                        <div className="cr-hint" style={{ textAlign: "center" }}>{fmtPct(mortgageRate)} · {mortgageTerm} years</div>
                      </div>
                      <CostRow label="Loan Amount" value={mortgageLoan} />
                      <CostRow label="Total Repaid" value={mortgage.total} />
                      <CostRow label="Total Interest" value={mortgage.interest} />
                    </Card>
                    <Card title="Rate Sensitivity" subtitle="What your payment becomes if rates move">
                      {[-1, -0.5, 0, 0.5, 1].map(delta => {
                        const m = calcMortgage(mortgageLoan, mortgageRate + delta, mortgageTerm);
                        const diff = m.monthly - mortgage.monthly;
                        return (
                          <div key={delta} className="cr-row">
                            <span className="cr-row-label">{delta === 0 ? "Your rate" : (delta > 0 ? "+" : "") + delta + "%"} ({fmtPct(mortgageRate + delta)})</span>
                            <span className={"cr-row-val " + (delta === 0 ? "cr-accent" : diff > 0 ? "cr-neg" : "cr-pos")}>{delta === 0 ? fmt(mortgage.monthly) : (diff > 0 ? "+" : "") + fmt(diff) + "/mo"}</span>
                          </div>
                        );
                      })}
                      <div className="cr-note" style={{ marginTop: 12 }}><strong>Lender stress test:</strong> at {fmtPct(mortgageRate + STRESS_DELTA)} your payment would be {fmt(stressMortgage.monthly)}/mo. Lenders check you could still afford this.</div>
                    </Card>
                  </div>
                  <Card title="Affordability Check" subtitle="Optional — enter your household income to sanity-check the loan size">
                    <div className="cr-afford">
                      <div style={{ flex: 1, minWidth: 200 }}>
                        <label className="cr-field-label">Gross annual household income</label>
                        <MoneyInput value={income} onChange={setIncome} placeholder="e.g. 85,000" />
                      </div>
                      {income > 0 && (
                        <div className={"cr-lti " + (lti <= LTI_CAP ? "cr-lti-ok" : "cr-lti-warn")}>
                          <div className="cr-hint" style={{ margin: 0 }}>Loan-to-income</div>
                          <div className="cr-lti-val">{lti.toFixed(1)}×</div>
                          <div className="cr-hint" style={{ margin: 0 }}>{lti <= LTI_CAP ? `Within the typical ~${LTI_CAP}× lender ceiling` : `Above the typical ~${LTI_CAP}× ceiling — most lenders would cap your loan at ${fmt(income * LTI_CAP)}`}</div>
                        </div>
                      )}
                    </div>
                  </Card>
                </React.Fragment>)}

                {/* STAMP DUTY */}
                {tab === "stampduty" && (<React.Fragment>
                  <Card title="Stamp Duty Land Tax" subtitle="England & NI · Post 1 April 2025 · HMRC rates">
                    <div style={{ marginBottom: 14 }}>
                      <div className="cr-hint">Buyer type — set from your journey, adjustable here</div>
                      <PillToggle options={[{ value: "standard", label: "Standard" },{ value: "firstTime", label: "First-Time Buyer" },{ value: "additional", label: "Additional (+5%)" }]} value={buyerType} onChange={setBuyerType} />
                    </div>
                    <SliderInput label="Property Price" value={offerPrice} onChange={setOfferPrice} min={100000} max={3000000} step={5000} />
                  </Card>
                  <div className="cr-grid-2">
                    <Card title="Your Band Breakdown" accent="var(--sage)">
                      {sdlt.bands.length === 0 && <div className="cr-hint" style={{ padding: "8px 0" }}>No stamp duty due at this price.</div>}
                      {sdlt.bands.map((b, i) => (
                        <div key={i} className="cr-band">
                          <span className="cr-band-label">{b.label}</span>
                          <div className="cr-band-bar"><div className="cr-band-fill" style={{ width: `${sdlt.total > 0 ? Math.min(100, b.tax / sdlt.total * 100) : 0}%` }} /></div>
                          <span className="cr-band-rate">{b.rate}%</span>
                          <span className="cr-band-tax">{fmt(b.tax)}</span>
                        </div>
                      ))}
                      <div className="cr-row cr-row-hl" style={{ marginTop: 6 }}>
                        <span className="cr-row-label">Total SDLT</span>
                        <span className="cr-row-val cr-accent" style={{ fontSize: 18 }}>{fmt(sdlt.total)}</span>
                      </div>
                      <div className="cr-hint" style={{ marginTop: 8 }}>Effective rate: {offerPrice > 0 ? fmtPct(sdlt.total / offerPrice * 100) : "0%"} of purchase price · Due within 14 days of completion</div>
                    </Card>
                    <Card title="Rate Tables">
                      <div className="cr-hint">Standard residential</div>
                      {[["£0 – £125,000","0%"],["£125,001 – £250,000","2%"],["£250,001 – £925,000","5%"],["£925,001 – £1,500,000","10%"],["Above £1,500,000","12%"]].map(([b,r]) => (
                        <div key={b} className="cr-row"><span className="cr-row-label">{b}</span><span className="cr-row-val cr-sage">{r}</span></div>
                      ))}
                      <div className="cr-note" style={{ marginTop: 12 }}>
                        <strong>First-time buyers:</strong> 0% to £300k, 5% on £300k–£500k. No relief above £500k.<br />
                        <strong>Additional property:</strong> +5% surcharge on every band.
                      </div>
                    </Card>
                  </div>
                </React.Fragment>)}

                {/* SCENARIOS */}
                {tab === "scenario" && (<React.Fragment>
                  <div className="cr-scen-head">
                    <div>
                      <div className="cr-card-title">Stress-test your position</div>
                      <div className="cr-hint" style={{ marginTop: 2 }}>Move the levers — your base case stays untouched</div>
                    </div>
                    <button onClick={() => setScen({ offerPrice, salePrice, depositPct, rate: mortgageRate })} className="cr-link cr-reset">Reset to base</button>
                  </div>
                  <div className="cr-scen-grid">
                    <div className="cr-scen-lever">
                      <div className="cr-lever-label">Offer Price</div>
                      <SliderInput value={scen.offerPrice} onChange={v => setScen(p => ({ ...p, offerPrice: v }))} min={Math.max(50000, offerPrice - 250000)} max={offerPrice + 300000} step={5000} />
                      <div className="cr-hint" style={{ margin: 0 }}>Deposit {fmt(sDeposit)} · SDLT {fmt(sSDLT.total)}</div>
                    </div>
                    {hasSale && (
                      <div className="cr-scen-lever">
                        <div className="cr-lever-label">Sale Price</div>
                        <SliderInput value={scen.salePrice} onChange={v => setScen(p => ({ ...p, salePrice: v }))} min={Math.max(50000, salePrice - 200000)} max={salePrice + 200000} step={5000} />
                        <div className="cr-hint" style={{ margin: 0 }}>Net proceeds {fmt(sNetSale)}</div>
                      </div>
                    )}
                    <div className="cr-scen-lever">
                      <div className="cr-lever-label">Deposit %</div>
                      <SliderInput value={scen.depositPct} onChange={v => setScen(p => ({ ...p, depositPct: v }))} min={5} max={60} step={1} prefix="" suffix="%" />
                      <div className="cr-hint" style={{ margin: 0 }}>{fmt(sDeposit)} · LTV {fmtPct(100 - scen.depositPct)}</div>
                    </div>
                    <div className="cr-scen-lever">
                      <div className="cr-lever-label">Mortgage Rate</div>
                      <SliderInput value={scen.rate} onChange={v => setScen(p => ({ ...p, rate: v }))} min={1} max={10} step={0.05} prefix="" suffix="%" />
                      <div className="cr-hint" style={{ margin: 0 }}>{fmt(sMortgage.monthly)}/mo</div>
                    </div>
                  </div>

                  <div className="cr-card">
                    <div className="cr-scen-summary-head">What this means for you</div>
                    <div className="cr-scen-3col">
                      {[
                        { label: "Base Case", val: surplus, sub: fmt(mortgage.monthly) + "/mo" },
                        { label: "Your Scenario", val: sSurplus, sub: fmt(sMortgage.monthly) + "/mo", hl: true },
                        { label: "Change", val: sSurplus - surplus, sub: (sMortgage.monthly > mortgage.monthly ? "+" : "") + fmt(sMortgage.monthly - mortgage.monthly) + "/mo" },
                      ].map(({ label, val, sub, hl }) => (
                        <div key={label} className={"cr-scen-col" + (hl ? " cr-scen-col-hl" : "")}>
                          <div className="cr-scen-col-label">{label}</div>
                          <div className={"cr-scen-col-val " + (val >= 0 ? "cr-pos" : "cr-neg")}>{val >= 0 ? "+" : ""}{fmt(val)}</div>
                          <div className="cr-hint" style={{ margin: 0 }}>{sub}</div>
                        </div>
                      ))}
                    </div>
                    <div className="cr-card-body">
                      {[
                        { label: "Total Cash Needed", base: totalCashNeeded, s: sNeeded, lb: true },
                        { label: "Total Cash Available", base: cashAvailable, s: sAvailable, lb: false },
                        { label: "Deposit", base: depositAmount, s: sDeposit, lb: true },
                        { label: "Stamp Duty", base: sdlt.total, s: sSDLT.total, lb: true },
                        { label: "Monthly Mortgage", base: mortgage.monthly, s: sMortgage.monthly, lb: true },
                      ].map(({ label, base, s, lb }) => {
                        const diff = s - base;
                        const good = lb ? diff <= 0 : diff >= 0;
                        const cls = diff === 0 ? "cr-muted" : good ? "cr-pos" : "cr-neg";
                        return (
                          <div key={label} className="cr-row">
                            <span className="cr-row-label">{label}</span>
                            <div className="cr-scen-delta">
                              <span className="cr-row-sub">{fmt(base)}</span>
                              <span className="cr-row-sub">→</span>
                              <span className="cr-row-val">{fmt(s)}</span>
                              <span className={"cr-chip " + cls}>{diff === 0 ? "No change" : (diff > 0 ? "+" : "") + fmt(diff)}</span>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </React.Fragment>)}
              </div>
            </div>
          )}

          {/* TWEAKS */}
          <TweaksPanel>
            <TweakSection label="Design direction" />
            <TweakRadio label="Direction" value={t.direction} options={[{value:"savoy",label:"Savoy"},{value:"monogram",label:"Monogram"}]} onChange={v => setTweak("direction", v)} />
            <TweakSection label="Detailing" />
            <TweakColor label="Accent" value={t.accent} options={["#c8a24a","#c98a5e","#7fae9e","#c5bca6"]} onChange={v => setTweak("accent", v)} />
            <TweakToggle label="Deco ornaments" value={t.ornaments} onChange={v => setTweak("ornaments", v)} />
          </TweaksPanel>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
