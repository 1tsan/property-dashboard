<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Property Transaction Dashboard | fasanya.co.uk</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0f0f13; --surface:#181820; --surface2:#1e1e28; --border:#2a2a38;
      --text:#f0ede8; --muted:#8a87a0; --accent:#c9a96e; --accent2:#7eb8b0;
      --accent3:#e07b6a; --green:#6ec99a; --red:#e07b6a; --radius:12px;
    }
    html, body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
    #root { min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useRef } = React;

    // ─── SDLT Calculator ──────────────────────────────────────────────────────
    function calcSDLT(price, buyerType) {
      if (price <= 0) return { total: 0, bands: [] };
      let bands = [];
      let type = buyerType;
      if (type === "firstTime") {
        if (price > 500000) { type = "standard"; }
        else {
          const b1 = Math.min(price, 300000);
          const b2 = Math.max(0, Math.min(price, 500000) - 300000);
          bands = [
            { label: "£0 – £300,000", rate: 0, taxable: b1, tax: 0 },
            { label: "£300,001 – £500,000", rate: 5, taxable: b2, tax: b2 * 0.05 },
          ];
          return { total: bands.reduce((s, b) => s + b.tax, 0), bands };
        }
      }
      if (type === "standard") {
        const thresholds = [
          { limit: 125000, rate: 0 }, { limit: 250000, rate: 2 },
          { limit: 925000, rate: 5 }, { limit: 1500000, rate: 10 }, { limit: Infinity, rate: 12 }
        ];
        const labels = ["£0 – £125,000","£125,001 – £250,000","£250,001 – £925,000","£925,001 – £1,500,000","Above £1,500,000"];
        let prev = 0;
        for (let i = 0; i < thresholds.length; i++) {
          const { limit, rate } = thresholds[i];
          if (price <= prev) break;
          const taxable = Math.min(price, limit) - prev;
          if (taxable > 0) bands.push({ label: labels[i], rate, taxable, tax: taxable * (rate / 100) });
          prev = limit;
        }
        return { total: bands.reduce((s, b) => s + b.tax, 0), bands };
      }
      if (type === "additional") {
        const thresholds = [
          { limit: 125000, base: 0, surcharge: 5 }, { limit: 250000, base: 2, surcharge: 5 },
          { limit: 925000, base: 5, surcharge: 5 }, { limit: 1500000, base: 10, surcharge: 5 },
          { limit: Infinity, base: 12, surcharge: 5 }
        ];
        const labels = ["£0 – £125,000 (5%)","£125,001 – £250,000 (7%)","£250,001 – £925,000 (10%)","£925,001 – £1,500,000 (15%)","Above £1,500,000 (17%)"];
        let prev = 0;
        for (let i = 0; i < thresholds.length; i++) {
          const { limit, base, surcharge } = thresholds[i];
          if (price <= prev) break;
          const taxable = Math.min(price, limit) - prev;
          const rate = base + surcharge;
          if (taxable > 0) bands.push({ label: labels[i], rate, taxable, tax: taxable * (rate / 100) });
          prev = limit;
        }
        return { total: bands.reduce((s, b) => s + b.tax, 0), bands };
      }
      return { total: 0, bands: [] };
    }

    function fmt(n) {
      if (n === undefined || n === null || isNaN(n)) return "£0";
      const abs = Math.abs(Math.round(n));
      const str = "£" + abs.toLocaleString("en-GB");
      return n < 0 ? "-" + str : str;
    }
    function fmtPct(n) { return n.toFixed(2) + "%"; }

    function calcMortgage(principal, annualRate, years) {
      if (!principal || !annualRate || !years) return { monthly: 0, total: 0, interest: 0 };
      const r = annualRate / 100 / 12;
      const n = years * 12;
      if (r === 0) return { monthly: principal / n, total: principal, interest: 0 };
      const monthly = (principal * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
      const total = monthly * n;
      return { monthly, total, interest: total - principal };
    }

    // ─── Components ───────────────────────────────────────────────────────────
    function SliderInput({ label, value, onChange, min, max, step = 1000, prefix = "£", suffix = "", hint }) {
      const pct = Math.min(100, Math.max(0, ((value - min) / (max - min)) * 100));
      return (
        <div className="slider-wrap">
          {label && (
            <div className="slider-header">
              <span className="slider-label">{label}</span>
              <span className="slider-value">{prefix}{typeof value === "number" ? value.toLocaleString("en-GB") : value}{suffix}</span>
            </div>
          )}
          {hint && <div className="slider-hint">{hint}</div>}
          <div className="slider-track-wrap">
            <div className="slider-fill" style={{ width: `${pct}%` }} />
            <input type="range" min={min} max={max} step={step} value={value}
              onChange={e => onChange(Number(e.target.value))} className="slider" />
          </div>
          <div className="slider-bounds">
            <span>{prefix}{min.toLocaleString("en-GB")}{suffix}</span>
            <span>{prefix}{max.toLocaleString("en-GB")}{suffix}</span>
          </div>
        </div>
      );
    }

    function PillToggle({ options, value, onChange }) {
      return (
        <div className="pill-toggle">
          {options.map(o => (
            <button key={o.value} className={`pill ${value === o.value ? "active" : ""}`}
              onClick={() => onChange(o.value)}>{o.label}</button>
          ))}
        </div>
      );
    }

    function Card({ title, subtitle, children, accent }) {
      return (
        <div className="card" style={accent ? { borderTop: `3px solid ${accent}` } : {}}>
          <div className="card-header">
            <h2 className="card-title">{title}</h2>
            {subtitle && <p className="card-sub">{subtitle}</p>}
          </div>
          {children}
        </div>
      );
    }

    function CostRow({ label, value, sub, highlight }) {
      return (
        <div className={`cost-row ${highlight ? "highlight" : ""}`}>
          <span className="cost-label">{label}</span>
          <div className="cost-right">
            {sub && <span className="cost-sub">{sub}</span>}
            <span className="cost-value">{fmt(value)}</span>
          </div>
        </div>
      );
    }

    // ─── Main App ─────────────────────────────────────────────────────────────
    function App() {
      const [tab, setTab] = useState("overview");
      const printRef = useRef(null);

      const [offerPrice, setOfferPrice] = useState(750000);
      const [depositPct, setDepositPct] = useState(20);
      const [buyerType, setBuyerType] = useState("standard");
      const [mortgageRate, setMortgageRate] = useState(4.5);
      const [mortgageTerm, setMortgageTerm] = useState(25);
      const [salePrice, setSalePrice] = useState(420000);
      const [agentFeePct, setAgentFeePct] = useState(1.5);
      const [agentFeeVAT, setAgentFeeVAT] = useState(true);
      const [buyerSolicitorFee, setBuyerSolicitorFee] = useState(2000);
      const [sellerSolicitorFee, setSellerSolicitorFee] = useState(1500);
      const [surveyFee, setSurveyFee] = useState(800);
      const [removals, setRemovals] = useState(1500);
      const [mortgageArrangement, setMortgageArrangement] = useState(999);
      const [otherCosts, setOtherCosts] = useState(500);
      const [existingMortgage, setExistingMortgage] = useState(150000);
      const [savings, setSavings] = useState(50000);

      const [scenOfferPrice, setScenOfferPrice] = useState(750000);
      const [scenSalePrice, setScenSalePrice] = useState(420000);
      const [scenDepositPct, setScenDepositPct] = useState(20);
      const [scenMortgageRate, setScenMortgageRate] = useState(4.5);

      // Base calcs
      const depositAmount = useMemo(() => (offerPrice * depositPct) / 100, [offerPrice, depositPct]);
      const mortgageLoan = useMemo(() => offerPrice - depositAmount, [offerPrice, depositAmount]);
      const ltv = useMemo(() => (mortgageLoan / offerPrice) * 100, [mortgageLoan, offerPrice]);
      const sdlt = useMemo(() => calcSDLT(offerPrice, buyerType), [offerPrice, buyerType]);
      const mortgage = useMemo(() => calcMortgage(mortgageLoan, mortgageRate, mortgageTerm), [mortgageLoan, mortgageRate, mortgageTerm]);
      const agentFeeBase = useMemo(() => (salePrice * agentFeePct) / 100, [salePrice, agentFeePct]);
      const agentFeeTotal = useMemo(() => agentFeeBase * (agentFeeVAT ? 1.2 : 1), [agentFeeBase, agentFeeVAT]);
      const grossSaleProceeds = useMemo(() => salePrice - agentFeeTotal - sellerSolicitorFee, [salePrice, agentFeeTotal, sellerSolicitorFee]);
      const netSaleProceeds = useMemo(() => grossSaleProceeds - existingMortgage, [grossSaleProceeds, existingMortgage]);
      const saleEquity = useMemo(() => salePrice - existingMortgage, [salePrice, existingMortgage]);
      const saleEquityPct = useMemo(() => salePrice > 0 ? (saleEquity / salePrice) * 100 : 0, [saleEquity, salePrice]);
      const totalBuyingCosts = useMemo(() => sdlt.total + buyerSolicitorFee + surveyFee + removals + mortgageArrangement + otherCosts, [sdlt.total, buyerSolicitorFee, surveyFee, removals, mortgageArrangement, otherCosts]);
      const totalCashNeeded = useMemo(() => depositAmount + totalBuyingCosts, [depositAmount, totalBuyingCosts]);
      const cashAvailable = useMemo(() => savings + netSaleProceeds, [savings, netSaleProceeds]);
      const cashSurplusDeficit = useMemo(() => cashAvailable - totalCashNeeded, [cashAvailable, totalCashNeeded]);

      // Scenario calcs
      const scenDepositAmt = (scenOfferPrice * scenDepositPct) / 100;
      const scenLoan = scenOfferPrice - scenDepositAmt;
      const scenSDLT = calcSDLT(scenOfferPrice, buyerType);
      const scenAgentFee = (scenSalePrice * agentFeePct) / 100 * (agentFeeVAT ? 1.2 : 1);
      const scenNetSale = scenSalePrice - scenAgentFee - sellerSolicitorFee - existingMortgage;
      const scenBuyingCosts = scenSDLT.total + buyerSolicitorFee + surveyFee + removals + mortgageArrangement + otherCosts;
      const scenCashNeeded = scenDepositAmt + scenBuyingCosts;
      const scenCashAvailable = savings + scenNetSale;
      const scenSurplus = scenCashAvailable - scenCashNeeded;
      const scenMortgage = calcMortgage(scenLoan, scenMortgageRate, mortgageTerm);
      const scenDiff = scenSurplus - cashSurplusDeficit;

      const resetScenario = () => {
        setScenOfferPrice(offerPrice); setScenSalePrice(salePrice);
        setScenDepositPct(depositPct); setScenMortgageRate(mortgageRate);
      };

      const today = new Date().toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });

      const buildPrintHTML = () => {
        const s = cashSurplusDeficit;
        const sdltBandsHTML = sdlt.bands.map(b =>
          `<div class="pr"><span style="color:#555">${b.label}</span><span style="color:#888">${b.rate}%</span><span style="font-weight:600">${fmt(b.tax)}</span></div>`
        ).join("");
        const lev = (label, sv, bv, lowerBetter, vd, bd) => {
          const d = sv - bv;
          const isGood = lowerBetter ? d <= 0 : d >= 0;
          const cls = d === 0 ? "neu" : isGood ? "pos" : "neg";
          const chip = d === 0 ? "Base" : (d > 0 ? "+" : "") + fmt(d);
          return `<div class="pl"><div class="pll">${label}</div><div class="plr"><span class="plv">${vd}</span><span class="pc ${cls}">${chip}</span></div><div class="plb">Base: ${bd}</div></div>`;
        };
        const imp = (label, base, scen, lowerBetter) => {
          const d = scen - base;
          const isGood = lowerBetter ? d <= 0 : d >= 0;
          const cls = d === 0 ? "neu" : isGood ? "pos" : "neg";
          const chip = d === 0 ? "No change" : (d > 0 ? "+" : "") + fmt(d);
          return `<div class="pi"><span style="color:#555">${label}</span><div style="display:flex;align-items:center;gap:8px"><span style="color:#999">${fmt(base)} →</span><span style="font-weight:600">${fmt(scen)}</span><span class="pc ${cls}">${chip}</span></div></div>`;
        };
        return `<div style="padding:28px 32px;max-width:820px;margin:0 auto;font-family:'DM Sans',sans-serif;font-size:12px;color:#1a1a2e">
        <div style="background:#0f0f13;color:#f0ede8;padding:20px 24px;border-radius:10px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center">
          <div><div style="font-size:10px;color:#8a87a0;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px">Property Transaction Summary</div>
          <div style="font-family:'Playfair Display',serif;font-size:19px;font-weight:700">Property Analysis Report</div>
          <div style="margin-top:5px;font-size:9px;border:1px solid #c9a96e;color:#c9a96e;padding:2px 8px;border-radius:20px;display:inline-block;letter-spacing:.5px;text-transform:uppercase">UK · England · ${today}</div></div>
          <div style="font-size:11px;color:#8a87a0;text-align:right;line-height:1.8"><div>New Home: ${fmt(offerPrice)}</div><div>Current Flat: ${fmt(salePrice)}</div><div>Mortgage: ${fmtPct(mortgageRate)} · ${mortgageTerm}yr</div></div>
        </div>
        <div style="border-radius:8px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px;${s >= 0 ? "background:#f0fdf4;border:1px solid #86efac" : "background:#fff7f6;border:1px solid #fca5a5"}">
          <div style="font-size:20px">${s >= 0 ? "✓" : "⚠"}</div>
          <div><div style="font-weight:700;font-size:13px;color:${s >= 0 ? "#16a34a" : "#dc2626"}">${s >= 0 ? "Cash surplus of " + fmt(s) + " after all costs" : "Cash shortfall of " + fmt(Math.abs(s)) + " — additional funds needed"}</div>
          <div style="font-size:10px;color:#666;margin-top:2px">${fmt(offerPrice)} offer · ${depositPct}% deposit · ${fmt(salePrice)} sale · ${mortgageRate}% over ${mortgageTerm} years</div></div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px">
          ${[
            ["Offer Price", fmt(offerPrice), "New property", "gold"],
            ["Deposit Required", fmt(depositAmount), `${depositPct}% · LTV ${fmtPct(ltv)}`, ""],
            ["Stamp Duty (SDLT)", fmt(sdlt.total), buyerType === "firstTime" ? "First-time buyer" : buyerType === "additional" ? "Additional property" : "Standard", ""],
            ["Monthly Mortgage", fmt(mortgage.monthly), `${fmtPct(mortgageRate)} · ${mortgageTerm}yr`, ""],
            ["Net Sale Proceeds", fmt(netSaleProceeds), "After fees & mortgage paydown", ""],
            ["Cash Surplus/Deficit", (s >= 0 ? "+" : "") + fmt(s), "After all costs", s >= 0 ? "pos" : "neg"]
          ].map(([l,v,sub,cls]) => `<div style="background:#f8f7f5;border:1px solid #e5e3de;border-radius:7px;padding:10px 12px">
            <div style="font-size:9px;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">${l}</div>
            <div style="font-size:15px;font-family:'Playfair Display',serif;font-weight:700;color:${cls==="gold"?"#b8860b":cls==="pos"?"#16a34a":cls==="neg"?"#dc2626":"#1a1a2e"}">${v}</div>
            <div style="font-size:9px;color:#888;margin-top:2px">${sub}</div></div>`).join("")}
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
          <div style="background:#f8f7f5;border:1px solid #e5e3de;border-radius:7px;overflow:hidden">
            <div style="background:#1a1a2e;color:#f0ede8;font-family:'Playfair Display',serif;font-size:12px;padding:8px 12px">Cash Needed to Buy</div>
            <div style="padding:10px 12px">
              ${[["Deposit ("+depositPct+"%)",fmt(depositAmount)],["Stamp Duty (SDLT)",fmt(sdlt.total)],["Buyer's Solicitor",fmt(buyerSolicitorFee)],["Survey / Valuation",fmt(surveyFee)],["Mortgage Arrangement",fmt(mortgageArrangement)],["Removals",fmt(removals)],["Other Costs",fmt(otherCosts)]].map(([l,v])=>`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #e9e7e2;font-size:11px"><span style="color:#555">${l}</span><span style="font-weight:600">${v}</span></div>`).join("")}
              <div style="display:flex;justify-content:space-between;padding:9px 12px;background:#1a1a2e;margin:8px -12px -10px"><span style="color:#c9a96e;font-weight:600;font-size:11px">TOTAL CASH TO BUY</span><span style="color:#c9a96e;font-size:13px;font-family:'Playfair Display',serif;font-weight:700">${fmt(totalCashNeeded)}</span></div>
            </div>
          </div>
          <div style="background:#f8f7f5;border:1px solid #e5e3de;border-radius:7px;overflow:hidden">
            <div style="background:#1a1a2e;color:#f0ede8;font-family:'Playfair Display',serif;font-size:12px;padding:8px 12px">Cash Available from Sale</div>
            <div style="padding:10px 12px">
              ${[["Sale Price",fmt(salePrice)],["Agent Fee (incl. VAT)","-"+fmt(agentFeeTotal)],["Seller's Solicitor","-"+fmt(sellerSolicitorFee)],["Existing Mortgage Repaid","-"+fmt(existingMortgage)],["Net Cash from Sale",fmt(netSaleProceeds)],["Savings / Other Cash",fmt(savings)]].map(([l,v])=>`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #e9e7e2;font-size:11px"><span style="color:#555">${l}</span><span style="font-weight:600">${v}</span></div>`).join("")}
              <div style="display:flex;justify-content:space-between;padding:9px 12px;background:#1a1a2e;margin:8px -12px -10px"><span style="color:#c9a96e;font-weight:600;font-size:11px">TOTAL CASH AVAILABLE</span><span style="color:#c9a96e;font-size:13px;font-family:'Playfair Display',serif;font-weight:700">${fmt(cashAvailable)}</span></div>
            </div>
          </div>
        </div>
        <div style="background:#f8f7f5;border:1px solid #e5e3de;border-radius:7px;overflow:hidden;margin-bottom:14px">
          <div style="background:#1a1a2e;color:#f0ede8;font-family:'Playfair Display',serif;font-size:12px;padding:8px 12px">Mortgage Summary</div>
          <div style="padding:10px 12px;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px">
            ${[["Loan Amount",fmt(mortgageLoan)],["Interest Rate",fmtPct(mortgageRate)],["Monthly Payment",fmt(mortgage.monthly)],["Total Interest",fmt(mortgage.interest)]].map(([l,v])=>`<div><div style="font-size:9px;color:#888;margin-bottom:2px">${l}</div><div style="font-size:13px;font-weight:700;font-family:'Playfair Display',serif">${v}</div></div>`).join("")}
          </div>
        </div>
        <div style="background:#f8f7f5;border:1px solid #e5e3de;border-radius:7px;overflow:hidden;margin-bottom:14px">
          <div style="background:#1a1a2e;color:#f0ede8;font-family:'Playfair Display',serif;font-size:12px;padding:8px 12px">Stamp Duty (SDLT) · England · Post 1 April 2025</div>
          <div style="padding:10px 12px">${sdltBandsHTML}
            <div style="display:flex;justify-content:space-between;padding-top:7px;border-top:1px solid #e9e7e2;font-weight:700;font-size:11px"><span>Total SDLT</span><span style="color:#b8860b;font-size:13px;font-family:'Playfair Display',serif">${fmt(sdlt.total)}</span></div>
          </div>
        </div>
        <div style="background:#f0f4ff;border:1px solid #c7d7f9;border-radius:8px;padding:12px 14px;margin-bottom:14px">
          <div style="font-family:'Playfair Display',serif;font-size:12px;font-weight:700;margin-bottom:8px">Scenario Analysis</div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:7px;margin-bottom:10px">
            ${lev("Offer Price", scenOfferPrice, offerPrice, true, fmt(scenOfferPrice), fmt(offerPrice))}
            ${lev("Sale Price", scenSalePrice, salePrice, false, fmt(scenSalePrice), fmt(salePrice))}
            ${lev("Deposit %", scenDepositPct, depositPct, true, scenDepositPct+"% = "+fmt(scenDepositAmt), depositPct+"%")}
            ${lev("Mortgage Rate", scenMortgageRate, mortgageRate, true, scenMortgageRate+"%", mortgageRate+"%")}
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:10px">
            <div style="background:#f1f5f9;border:1px solid #cbd5e1;border-radius:6px;padding:9px 10px;text-align:center">
              <div style="font-size:8px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;color:#64748b">Base Case</div>
              <div style="font-size:14px;font-weight:700;font-family:'Playfair Display',serif;color:${cashSurplusDeficit>=0?"#16a34a":"#dc2626"}">${cashSurplusDeficit>=0?"+":""}${fmt(cashSurplusDeficit)}</div>
              <div style="font-size:9px;color:#888;margin-top:2px">${fmt(mortgage.monthly)}/mo</div>
            </div>
            <div style="background:#1a1a2e;border-radius:6px;padding:9px 10px;text-align:center">
              <div style="font-size:8px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;color:#c9a96e">Scenario</div>
              <div style="font-size:14px;font-weight:700;font-family:'Playfair Display',serif;color:${scenSurplus>=0?"#6ec99a":"#e07b6a"}">${scenSurplus>=0?"+":""}${fmt(scenSurplus)}</div>
              <div style="font-size:9px;color:#8a87a0;margin-top:2px">${fmt(scenMortgage.monthly)}/mo</div>
            </div>
            <div style="background:#fff;border:1px solid #e5e7eb;border-radius:6px;padding:9px 10px;text-align:center">
              <div style="font-size:8px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;color:#64748b">Change vs Base</div>
              <div style="font-size:14px;font-weight:700;font-family:'Playfair Display',serif;color:${scenDiff>=0?"#16a34a":"#dc2626"}">${scenDiff>=0?"+":""}${fmt(scenDiff)}</div>
              <div style="font-size:9px;color:${scenMortgage.monthly>mortgage.monthly?"#dc2626":"#16a34a"};margin-top:2px">${scenMortgage.monthly===mortgage.monthly?"No monthly change":(scenMortgage.monthly>mortgage.monthly?"+":"")+fmt(scenMortgage.monthly-mortgage.monthly)+"/mo"}</div>
            </div>
          </div>
          <div style="background:#fff;border-radius:5px;border:1px solid #c7d7f9;padding:8px 10px">
            ${imp("Total Cash Needed", totalCashNeeded, scenCashNeeded, true)}
            ${imp("Total Cash Available", cashAvailable, scenCashAvailable, false)}
            ${imp("Deposit Required", depositAmount, scenDepositAmt, true)}
            ${imp("Stamp Duty (SDLT)", sdlt.total, scenSDLT.total, true)}
            ${imp("Monthly Mortgage", mortgage.monthly, scenMortgage.monthly, true)}
          </div>
        </div>

                    <div style={{ marginTop: 12 }}>
                      <div className="num-input-wrap"><label className="num-input-label">Seller's Solicitor / Conveyancer Fee (£)</label><input className="num-input" type="number" value={sellerSolicitorFee} onChange={e => setSellerSolicitorFee(Number(e.target.value))} /></div>
                      <div className="num-input-wrap"><label className="num-input-label">Additional Savings / Cash Available (£)</label><input className="num-input" type="number" value={savings} onChange={e => setSavings(Number(e.target.value))} /></div>
                    </div>
                  </div>
                </Card>
                <Card title="Sale Proceeds Breakdown">
                  <div className="card-body">
                    <CostRow label="Gross Sale Price" value={salePrice} />
                    <CostRow label="Estate Agent Fee (excl VAT)" value={-agentFeeBase} sub={`${agentFeePct}%`} />
                    {agentFeeVAT && <CostRow label="VAT on Agent Fee (20%)" value={-(agentFeeTotal - agentFeeBase)} />}
                    <CostRow label="Seller's Solicitor" value={-sellerSolicitorFee} />
                    <CostRow label="Gross Proceeds (before mortgage)" value={grossSaleProceeds} highlight />
                    <div style={{ marginTop: 6 }}>
                      <CostRow label="Existing Mortgage Repayment" value={-existingMortgage} sub="Paid to lender on completion" />
                      <CostRow label="Net Cash from Sale" value={netSaleProceeds} highlight />
                    </div>
                    <div style={{ marginTop: 6 }}>
                      <CostRow label="Plus Savings" value={savings} />
                      <CostRow label="Total Cash Available" value={cashAvailable} highlight />
                    </div>
                    <div style={{ marginTop: 12 }}>
                      <div style={{ fontSize: 11, color: "var(--muted)", marginBottom: 4 }}>Equity vs Mortgage in Flat</div>
                      <div className="mortgage-bar" style={{ height: 10, borderRadius: 5 }}><div className="mortgage-bar-fill" style={{ width: `${Math.min(100, Math.max(0, saleEquityPct))}%` }} /></div>
                      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, marginTop: 4 }}>
                        <span style={{ color: "var(--accent)" }}>Equity {fmt(saleEquity)} ({saleEquityPct.toFixed(1)}%)</span>
                        <span style={{ color: "var(--muted)" }}>Mortgage {fmt(existingMortgage)} ({(100 - saleEquityPct).toFixed(1)}%)</span>
                      </div>
                    </div>
                    {netSaleProceeds < 0 && <div className="info-box" style={{ marginTop: 10, borderColor: "rgba(224,123,106,.4)", background: "rgba(224,123,106,.07)" }}>⚠ Mortgage exceeds net sale proceeds — additional cash needed at completion.</div>}
                  </div>
                </Card>
              </>
            )}

            {/* MORTGAGE */}
            {tab === "mortgage" && (
              <>
                <Card title="Mortgage Calculator" subtitle="Repayment mortgage on capital + interest basis">
                  <div className="card-body">
                    <SliderInput label="Annual Interest Rate" value={mortgageRate} onChange={setMortgageRate} min={1} max={10} step={0.05} prefix="" suffix="%" hint="Current UK average 5-year fixed rate: ~4.3–4.8%" />
                    <SliderInput label="Mortgage Term" value={mortgageTerm} onChange={setMortgageTerm} min={5} max={35} step={1} prefix="" suffix=" years" />
                  </div>
                </Card>
                <div className="two-col">
                  <Card title="Monthly Repayment">
                    <div className="card-body">
                      <div style={{ textAlign: "center", padding: "14px 0" }}>
                        <div style={{ fontSize: 10, color: "var(--muted)", marginBottom: 5, textTransform: "uppercase", letterSpacing: "0.5px" }}>Monthly Payment</div>
                        <div style={{ fontSize: 34, fontFamily: "'Playfair Display', serif", color: "var(--accent)", fontWeight: 700 }}>{fmt(mortgage.monthly)}</div>
                        <div style={{ fontSize: 11, color: "var(--muted)", marginTop: 3 }}>per month for {mortgageTerm} years</div>
                      </div>
                      <CostRow label="Loan Amount" value={mortgageLoan} />
                      <CostRow label="Total Repaid" value={mortgage.total} />
                      <CostRow label="Total Interest" value={mortgage.interest} />
                    </div>
                  </Card>
                  <Card title="Loan Composition">
                    <div className="card-body">
                      <div style={{ marginBottom: 12 }}>
                        <div style={{ fontSize: 11, color: "var(--muted)", marginBottom: 5 }}>Principal vs Interest</div>
                        <div className="mortgage-bar" style={{ height: 14, borderRadius: 5 }}><div className="mortgage-bar-fill" style={{ width: `${mortgage.total > 0 ? (mortgageLoan / mortgage.total) * 100 : 0}%` }} /></div>
                        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, marginTop: 4 }}>
                          <span style={{ color: "var(--accent)" }}>Principal {mortgage.total > 0 ? ((mortgageLoan / mortgage.total) * 100).toFixed(0) : 0}%</span>
                          <span style={{ color: "var(--accent2)" }}>Interest {mortgage.total > 0 ? ((mortgage.interest / mortgage.total) * 100).toFixed(0) : 0}%</span>
                        </div>
                      </div>
                      <CostRow label="Principal" value={mortgageLoan} />
                      <CostRow label="Total Interest" value={mortgage.interest} />
                      <CostRow label="Total Cost" value={mortgage.total} highlight />
                      <div className="info-box" style={{ marginTop: 10 }}>
                        <strong>+0.5% rate</strong> → +{fmt(calcMortgage(mortgageLoan, mortgageRate + 0.5, mortgageTerm).monthly - mortgage.monthly)}/mo &nbsp;·&nbsp;
                        <strong>−0.5% rate</strong> → saves {fmt(mortgage.monthly - calcMortgage(mortgageLoan, mortgageRate - 0.5, mortgageTerm).monthly)}/mo
                      </div>
                    </div>
                  </Card>
                </div>
              </>
            )}

            {/* STAMP DUTY */}
            {tab === "stampdust" && (
              <>
                <Card title="Stamp Duty Land Tax (SDLT)" subtitle="England & Northern Ireland · Rates effective 1 April 2025 · Source: GOV.UK / HMRC">
                  <div className="card-body">
                    <div style={{ marginBottom: 12 }}>
                      <div className="slider-label" style={{ marginBottom: 6 }}>Buyer Type</div>
                      <PillToggle options={[{ value: "standard", label: "Standard (Home Mover)" },{ value: "firstTime", label: "First-Time Buyer" },{ value: "additional", label: "Additional Property (+5%)" }]} value={buyerType} onChange={setBuyerType} />
                    </div>
                    <SliderInput label="Property Price" value={offerPrice} onChange={setOfferPrice} min={100000} max={3000000} step={5000} />
                  </div>
                </Card>
                <div className="two-col">
                  <Card title="SDLT Band Breakdown" accent="var(--accent2)">
                    <div className="card-body">
                      {sdlt.bands.length === 0 && <div style={{ color: "var(--muted)", fontSize: 12 }}>No stamp duty payable.</div>}
                      {sdlt.bands.map((b, i) => (
                        <div key={i} className="sdlt-band">
                          <span className="sdlt-band-label">{b.label}</span>
                          <div className="sdlt-band-bar-wrap"><div className="sdlt-band-bar" style={{ width: `${sdlt.total > 0 ? Math.min(100, (b.tax / sdlt.total) * 100) : 0}%` }} /></div>
                          <span className="sdlt-band-rate">{b.rate}%</span>
                          <span className="sdlt-band-tax">{fmt(b.tax)}</span>
                        </div>
                      ))}
                      <div style={{ padding: "11px 0 0", borderTop: "1px solid var(--border)", marginTop: 6, display: "flex", justifyContent: "space-between" }}>
                        <span style={{ fontWeight: 600, fontSize: 12 }}>Total SDLT</span>
                        <span style={{ fontWeight: 700, fontSize: 16, color: "var(--accent)", fontFamily: "'Playfair Display', serif" }}>{fmt(sdlt.total)}</span>
                      </div>
                    </div>
                  </Card>
                  <Card title="Current SDLT Rate Table">
                    <div className="card-body">
                      <div style={{ fontSize: 10, color: "var(--muted)", marginBottom: 8 }}>England & NI · Standard Residential · Post 1 April 2025</div>
                      {[["£0 – £125,000","0%"],["£125,001 – £250,000","2%"],["£250,001 – £925,000","5%"],["£925,001 – £1,500,000","10%"],["Above £1,500,000","12%"]].map(([band, rate]) => (
                        <div key={band} style={{ display: "flex", justifyContent: "space-between", padding: "7px 0", borderBottom: "1px solid var(--border)", fontSize: 11 }}>
                          <span style={{ color: "var(--muted)" }}>{band}</span>
                          <span style={{ fontWeight: 600, color: "var(--accent2)" }}>{rate}</span>
                        </div>
                      ))}
                      <div className="info-box" style={{ marginTop: 10 }}>
                        <strong>First-Time Buyers:</strong> 0% up to £300k · 5% £300k–£500k · No relief above £500k<br />
                        <strong>Additional Property:</strong> +5% surcharge on all bands<br />
                        <strong>Due:</strong> Within 14 days of completion
                      </div>
                    </div>
                  </Card>
                </div>
              </>
            )}

            {/* SCENARIO */}
            {tab === "scenario" && (
              <>
                <div className="scen-header">
                  <div className="scen-header-text">
                    <h3>Adjust the levers below</h3>
                    <p>Each lever shows its direct impact on your cash position in real time</p>
                  </div>
                  <button className="scen-reset-btn" onClick={resetScenario}>↺ Reset to base</button>
                </div>

                <div className="scen-levers">
                  {/* Offer Price */}
                  {(() => { const d = scenOfferPrice - offerPrice; const cls = d < 0 ? "pos" : d > 0 ? "neg" : "neu"; const chip = d === 0 ? "Base" : (d > 0 ? "+" : "") + fmt(d); return (
                    <div className="lever-card">
                      <div className="lever-card-top">
                        <div><div className="lever-card-label">Offer Price</div><div className="lever-card-value">{fmt(scenOfferPrice)}</div><div className="lever-card-sub">Deposit: {fmt(scenDepositAmt)} · SDLT: {fmt(scenSDLT.total)}</div></div>
                        <span className={`lever-chip ${cls}`}>{chip}</span>
                      </div>
                      <SliderInput value={scenOfferPrice} onChange={setScenOfferPrice} min={Math.max(50000, offerPrice - 250000)} max={offerPrice + 300000} step={5000} />
                      <div className="lever-insight">↑ higher offer = more deposit & SDLT needed · Base: {fmt(offerPrice)}</div>
                    </div>
                  ); })()}

                  {/* Sale Price */}
                  {(() => { const d = scenSalePrice - salePrice; const cls = d > 0 ? "pos" : d < 0 ? "neg" : "neu"; const chip = d === 0 ? "Base" : (d > 0 ? "+" : "") + fmt(d); return (
                    <div className="lever-card">
                      <div className="lever-card-top">
                        <div><div className="lever-card-label">Sale Price (Flat)</div><div className="lever-card-value">{fmt(scenSalePrice)}</div><div className="lever-card-sub">Net proceeds: {fmt(scenNetSale)}</div></div>
                        <span className={`lever-chip ${cls}`}>{chip}</span>
                      </div>
                      <SliderInput value={scenSalePrice} onChange={setScenSalePrice} min={Math.max(50000, salePrice - 200000)} max={salePrice + 200000} step={5000} />
                      <div className="lever-insight">↑ higher sale = more cash after mortgage paydown · Base: {fmt(salePrice)}</div>
                    </div>
                  ); })()}

                  {/* Deposit % */}
                  {(() => { const d = scenDepositPct - depositPct; const cls = d > 0 ? "neg" : d < 0 ? "pos" : "neu"; const chip = d === 0 ? "Base" : (d > 0 ? "+" : "") + d + "%"; return (
                    <div className="lever-card">
                      <div className="lever-card-top">
                        <div><div className="lever-card-label">Deposit %</div><div className="lever-card-value">{scenDepositPct}%</div><div className="lever-card-sub">{fmt(scenDepositAmt)} · LTV {fmtPct(100 - scenDepositPct)}</div></div>
                        <span className={`lever-chip ${cls}`}>{chip}</span>
                      </div>
                      <SliderInput value={scenDepositPct} onChange={setScenDepositPct} min={5} max={50} step={1} prefix="" suffix="%" />
                      <div className="lever-insight">↑ bigger deposit = lower mortgage but more upfront cash · Base: {depositPct}%</div>
                    </div>
                  ); })()}

                  {/* Mortgage Rate */}
                  {(() => { const d = +(scenMortgageRate - mortgageRate).toFixed(2); const cls = d > 0 ? "neg" : d < 0 ? "pos" : "neu"; const chip = d === 0 ? "Base" : (d > 0 ? "+" : "") + d.toFixed(2) + "%"; return (
                    <div className="lever-card">
                      <div className="lever-card-top">
                        <div><div className="lever-card-label">Mortgage Rate</div><div className="lever-card-value">{scenMortgageRate}%</div><div className="lever-card-sub">{fmt(scenMortgage.monthly)}/mo · Total: {fmt(scenMortgage.total)}</div></div>
                        <span className={`lever-chip ${cls}`}>{chip}</span>
                      </div>
                      <SliderInput value={scenMortgageRate} onChange={setScenMortgageRate} min={1} max={10} step={0.05} prefix="" suffix="%" />
                      <div className="lever-insight">↑ higher rate = larger monthly payment over {mortgageTerm} years · Base: {mortgageRate}%</div>
                    </div>
                  ); })()}
                </div>

                <div className="outcome-panel">
                  <div className="outcome-panel-header">
                    <div className="outcome-panel-title">What this means for you — end result</div>
                  </div>
                  <div className="outcome-boxes">
                    <div className="outcome-box">
                      <div className="outcome-box-label">Base Case</div>
                      <div className={`outcome-big ${cashSurplusDeficit >= 0 ? "pos" : "neg"}`}>{cashSurplusDeficit >= 0 ? "+" : ""}{fmt(cashSurplusDeficit)}</div>
                      <div className="outcome-box-sub">surplus / deficit</div>
                      <div className="outcome-box-sub" style={{ marginTop: 4 }}>{fmt(mortgage.monthly)}/mo mortgage</div>
                    </div>
                    <div className="outcome-box scenario">
                      <div className="outcome-box-label">Your Scenario</div>
                      <div className={`outcome-big ${scenSurplus >= 0 ? "pos" : "neg"}`}>{scenSurplus >= 0 ? "+" : ""}{fmt(scenSurplus)}</div>
                      <div className="outcome-box-sub">surplus / deficit</div>
                      <div className="outcome-box-sub" style={{ marginTop: 4 }}>{fmt(scenMortgage.monthly)}/mo mortgage</div>
                    </div>
                    <div className="outcome-box">
                      <div className="outcome-box-label">Change vs Base</div>
                      <div className={`outcome-big ${scenDiff >= 0 ? "pos" : "neg"}`}>{scenDiff >= 0 ? "+" : ""}{fmt(scenDiff)}</div>
                      <div className="outcome-box-sub">cash impact</div>
                      <div className="outcome-box-sub" style={{ marginTop: 4, color: scenMortgage.monthly > mortgage.monthly ? "var(--red)" : scenMortgage.monthly < mortgage.monthly ? "var(--green)" : "var(--muted)" }}>
                        {scenMortgage.monthly === mortgage.monthly ? "No monthly change" : (scenMortgage.monthly > mortgage.monthly ? "+" : "") + fmt(scenMortgage.monthly - mortgage.monthly) + "/mo"}
                      </div>
                    </div>
                  </div>
                  <div className="outcome-impact">
                    {[
                      { label: "Total Cash Needed", base: totalCashNeeded, scen: scenCashNeeded, lowerBetter: true },
                      { label: "Total Cash Available", base: cashAvailable, scen: scenCashAvailable, lowerBetter: false },
                      { label: "Deposit Required", base: depositAmount, scen: scenDepositAmt, lowerBetter: true },
                      { label: "Stamp Duty (SDLT)", base: sdlt.total, scen: scenSDLT.total, lowerBetter: true },
                      { label: "Monthly Mortgage Payment", base: mortgage.monthly, scen: scenMortgage.monthly, lowerBetter: true },
                    ].map(({ label, base, scen, lowerBetter }) => {
                      const d = scen - base;
                      const isGood = lowerBetter ? d <= 0 : d >= 0;
                      const cls = d === 0 ? "neu" : isGood ? "pos" : "neg";
                      const chip = d === 0 ? "No change" : (d > 0 ? "+" : "") + fmt(d);
                      return (
                        <div key={label} className="impact-row">
                          <span className="impact-label">{label}</span>
                          <div className="impact-right">
                            <span className="impact-base">{fmt(base)}</span>
                            <span className="impact-arrow">→</span>
                            <span className="impact-scen">{fmt(scen)}</span>
                            <span className={`impact-chip ${cls}`}>{chip}</span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </>
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
